<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singapore Bus Arrival Dashboard</title>
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: #161f30;
        --accent-color: #3b82f6;
        --text-main: #f3f4f6;
        --text-sub: #9ca3af;
        --border-color: #243049;
        --green-seat: #10b981;
        --yellow-stand: #f59e0b;
        --red-limited: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 20px;
        min-height: 100vh;
      }

      /* Top Progress Bar */
      #progress-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--border-color);
        z-index: 1000;
      }
      #progress-bar {
        height: 100%;
        width: 100%;
        background: var(--accent-color);
        transition: width 1s linear;
      }

      /* Header & Clock */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
      }

      .time-display {
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        color: #ffffff;
        line-height: 1;
      }

      .date-display {
        font-size: 1.1rem;
        color: var(--text-sub);
        margin-top: 5px;
      }

      .controls-top {
        display: flex;
        gap: 10px;
      }

      button {
        background: var(--accent-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button:active {
        opacity: 0.8;
      }

      /* Config Panel */
      .config-panel {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 20px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
        min-width: 200px;
      }

      .input-group label {
        font-size: 0.85rem;
        color: var(--text-sub);
        text-transform: uppercase;
        font-weight: 700;
      }

      .input-group input {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: white;
        padding: 10px;
        border-radius: 6px;
        font-size: 1rem;
      }

      /* Shortcuts Bar */
      .shortcuts-bar {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      .shortcut-btn {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        white-space: nowrap;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 0.95rem;
      }

      .shortcut-btn.active {
        background: var(--accent-color);
        border-color: var(--accent-color);
        color: white;
      }

      /* Bus Cards Grid */
      .bus-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 15px;
      }

      .bus-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bus-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .bus-number {
        font-size: 2.2rem;
        font-weight: 900;
        color: #ffffff;
        background: #1e293b;
        padding: 2px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
      }

      .arrivals-row {
        display: flex;
        gap: 10px;
        justify-content: space-between;
      }

      .arrival-slot {
        flex: 1;
        background: var(--bg-color);
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid var(--border-color);
      }

      .arrival-slot.next-bus {
        border-color: var(--accent-color);
      }

      .eta-time {
        font-size: 1.4rem;
        font-weight: 700;
        color: #ffffff;
      }

      .eta-time.arr {
        color: var(--green-seat);
        font-weight: 900;
      }

      .meta-tags {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin-top: 6px;
      }

      .badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge-sea {
        background: var(--green-seat);
        color: #000;
      }
      .badge-sda {
        background: var(--yellow-stand);
        color: #000;
      }
      .badge-lsd {
        background: var(--red-limited);
        color: #fff;
      }
      .badge-type {
        background: #334155;
        color: #fff;
      }

      .error-msg {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--red-limited);
        color: var(--red-limited);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="progress-container"><div id="progress-bar"></div></div>

    <div class="header">
      <div>
        <div class="time-display" id="clock">00:00:00</div>
        <div class="date-display" id="date">Loading date...</div>
      </div>
      <div class="controls-top">
        <button onclick="fetchBusData()">Fetch Now</button>
      </div>
    </div>

    <!-- Settings Configuration Panel -->
    <div class="config-panel">
      <div class="input-group">
        <label>LTA AccountKey API Key</label>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Paste LTA Key Here"
          onchange="saveConfig()"
        />
      </div>
      <div class="input-group">
        <label>Bus Stop Code</label>
        <input
          type="text"
          id="busStopInput"
          placeholder="e.g. 67011"
          onchange="saveConfig()"
        />
      </div>
    </div>

    <!-- Shortcuts Filter Bar -->
    <div class="shortcuts-bar" id="shortcutsBar">
      <!-- Shortcut buttons rendered dynamically -->
    </div>

    <div class="error-msg" id="errorBox"></div>

    <!-- Bus Cards -->
    <div class="bus-grid" id="busGrid">
      <!-- Bus arrivals will render here -->
    </div>

    <script>
      // --- CONFIGURATION & SHORTCUTS ---
      const HARDCODED_API_KEY = ""; // Optionally paste key here
      const DEFAULT_BUS_STOP = "67011"; // Change to your default bus stop code

      const SHORTCUTS = [
        { label: "All Buses", buses: [] },
        { label: "To Kajima", buses: ["45", "25", "854"] },
        {
          label: "To Eunos",
          buses: [
            "15",
            "21",
            "22",
            "25",
            "51",
            "55",
            "60",
            "61",
            "63",
            "63M",
            "854",
            "93",
            "94",
          ],
        },
        { label: "To Paya Lebar", buses: ["21", "51"] },
        { label: "To Kembangan/Bedok", buses: ["25", "854"] },
        { label: "To East Coast", buses: ["15", "55"] },
        { label: "To Orchard", buses: ["5"] },
      ];

      let activeFilterBuses = [];
      let refreshTimer = null;
      let countdownInterval = null;
      let secondsLeft = 30;

      // --- INITIALIZATION ---
      window.onload = () => {
        // Load saved settings from LocalStorage or fallbacks
        document.getElementById("apiKeyInput").value =
          localStorage.getItem("lta_api_key") || HARDCODED_API_KEY;
        document.getElementById("busStopInput").value =
          localStorage.getItem("lta_bus_stop") || DEFAULT_BUS_STOP;

        setupShortcuts();
        updateClock();
        setInterval(updateClock, 1000);

        fetchBusData();
        startAutoRefresh();
      };

      function saveConfig() {
        const key = document.getElementById("apiKeyInput").value.trim();
        const stop = document.getElementById("busStopInput").value.trim();
        localStorage.setItem("lta_api_key", key);
        localStorage.setItem("lta_bus_stop", stop);
        fetchBusData();
      }

      // --- REAL-TIME CLOCK ---
      function updateClock() {
        const now = new Date();
        // Format SGT time
        document.getElementById("clock").innerText = now.toLocaleTimeString(
          "en-SG",
          {
            timeZone: "Asia/Singapore",
            hour12: false,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          },
        );
        document.getElementById("date").innerText = now.toLocaleDateString(
          "en-SG",
          {
            timeZone: "Asia/Singapore",
            weekday: "long",
            day: "numeric",
            month: "short",
            year: "numeric",
          },
        );
      }

      // --- SHORTCUTS BAR ---
      function setupShortcuts() {
        const bar = document.getElementById("shortcutsBar");
        bar.innerHTML = "";
        SHORTCUTS.forEach((sc, index) => {
          const btn = document.createElement("button");
          btn.className = `shortcut-btn ${index === 0 ? "active" : ""}`;
          btn.innerText = sc.label;
          btn.onclick = () => {
            document
              .querySelectorAll(".shortcut-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            activeFilterBuses = sc.buses;
            fetchBusData();
          };
          bar.appendChild(btn);
        });
      }

      // --- DATA FETCHING (WITH CORS PROXY) ---
      async function fetchBusData() {
        const apiKey = document.getElementById("apiKeyInput").value.trim();
        const stopCode = document.getElementById("busStopInput").value.trim();
        const errorBox = document.getElementById("errorBox");

        if (!stopCode) {
          showError("Please enter a valid 5-digit Bus Stop Code.");
          return;
        }

        // 1. If no API Key is provided, render Mock Data automatically
        if (!apiKey) {
          showError("No API Key entered. Displaying Demo/Mock Data.");
          renderBuses(getMockData());
          resetCountdown();
          return;
        }

        errorBox.style.display = "none";

        // 2. Fetch directly using corsproxy.io wrapper
        const targetUrl = `https://datamall2.mytransport.sg/ltaodataservice/BusArrivalv2?BusStopCode=${stopCode}`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        try {
          const response = await fetch(proxyUrl, {
            method: "GET",
            headers: {
              AccountKey: apiKey,
              accept: "application/json",
            },
          });

          if (!response.ok) {
            throw new Error(`Server returned HTTP ${response.status}`);
          }

          const data = await response.json();
          if (data.Services) {
            renderBuses(data.Services);
          } else {
            showError("Unexpected API response structure.");
          }
        } catch (err) {
          console.error("LTA Fetch Error:", err);
          showError(`CORS/Fetch Error: ${err.message}. Displaying Demo Data.`);
          renderBuses(getMockData());
        }

        resetCountdown();
      }

      // --- RENDER BUS CARDS ---
      function renderBuses(services) {
        const grid = document.getElementById("busGrid");
        grid.innerHTML = "";

        // Filter buses if a destination shortcut is active
        let filtered = services;
        if (activeFilterBuses.length > 0) {
          filtered = services.filter((s) =>
            activeFilterBuses.includes(s.ServiceNo),
          );
        }

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="color: var(--text-sub); padding: 20px;">No bus services found matching active filter.</div>`;
          return;
        }

        filtered.forEach((service) => {
          const card = document.createElement("div");
          card.className = "bus-card";

          const next1 = parseETA(service.NextBus);
          const next2 = parseETA(service.NextBus2);
          const next3 = parseETA(service.NextBus3);

          card.innerHTML = `
          <div class="bus-header">
            <span class="bus-number">${service.ServiceNo}</span>
          </div>
          <div class="arrivals-row">
            ${renderSlot(next1, true)}
            ${renderSlot(next2, false)}
            ${renderSlot(next3, false)}
          </div>
        `;
          grid.appendChild(card);
        });
      }

      function renderSlot(etaObj, isFirst) {
        if (!etaObj) {
          return `<div class="arrival-slot"><div class="eta-time" style="color:var(--text-sub);">-</div></div>`;
        }

        const timeClass = etaObj.mins <= 0 ? "arr" : "";
        const text =
          etaObj.mins <= 0
            ? "Arr"
            : `${etaObj.mins} <span style="font-size:0.8rem">m</span>`;

        return `
        <div class="arrival-slot ${isFirst ? "next-bus" : ""}">
          <div class="eta-time ${timeClass}">${text}</div>
          <div class="meta-tags">
            ${getLoadBadge(etaObj.load)}
            ${getTypeBadge(etaObj.type)}
          </div>
        </div>
      `;
      }

      function parseETA(busObj) {
        if (!busObj || !busObj.EstimatedArrival) return null;
        const arrivalTime = new Date(busObj.EstimatedArrival);
        const now = new Date();
        const diffMs = arrivalTime - now;
        const mins = Math.floor(diffMs / 60000);

        return {
          mins: mins < 0 ? 0 : mins,
          load: busObj.Load,
          type: busObj.Feature === "WAB" ? busObj.Type : busObj.Type,
        };
      }

      function getLoadBadge(load) {
        if (load === "SEA") return `<span class="badge badge-sea">Seats</span>`;
        if (load === "SDA") return `<span class="badge badge-sda">Stand</span>`;
        if (load === "LSD") return `<span class="badge badge-lsd">Limit</span>`;
        return "";
      }

      function getTypeBadge(type) {
        if (type === "DD")
          return `<span class="badge badge-type">Double</span>`;
        if (type === "BD") return `<span class="badge badge-type">Bendy</span>`;
        return `<span class="badge badge-type">Single</span>`;
      }

      function showError(msg) {
        const errorBox = document.getElementById("errorBox");
        errorBox.innerText = msg;
        errorBox.style.display = "block";
      }

      // --- AUTO-REFRESH TIMER ---
      function startAutoRefresh() {
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
          secondsLeft--;
          const pct = (secondsLeft / 30) * 100;
          document.getElementById("progress-bar").style.width = `${pct}%`;

          if (secondsLeft <= 0) {
            fetchBusData();
          }
        }, 1000);
      }

      function resetCountdown() {
        secondsLeft = 30;
        document.getElementById("progress-bar").style.width = "100%";
      }

      // --- MOCK DATA FOR DEMO MODE ---
      function getMockData() {
        const now = new Date();
        return [
          {
            ServiceNo: "15",
            NextBus: {
              EstimatedArrival: new Date(now.getTime() + 100000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus2: {
              EstimatedArrival: new Date(now.getTime() + 480000).toISOString(),
              Load: "SDA",
              Type: "DD",
            },
            NextBus3: {
              EstimatedArrival: new Date(now.getTime() + 900000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
          },
          {
            ServiceNo: "21",
            NextBus: {
              EstimatedArrival: new Date(now.getTime() + 240000).toISOString(),
              Load: "SDA",
              Type: "DD",
            },
            NextBus2: {
              EstimatedArrival: new Date(now.getTime() + 720000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus3: {
              EstimatedArrival: new Date(now.getTime() + 1200000).toISOString(),
              Load: "LSD",
              Type: "DD",
            },
          },
          {
            ServiceNo: "60",
            NextBus: {
              EstimatedArrival: new Date(now.getTime() + 30000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus2: {
              EstimatedArrival: new Date(now.getTime() + 360000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus3: {
              EstimatedArrival: new Date(now.getTime() + 840000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
          },
          {
            ServiceNo: "150",
            NextBus: {
              EstimatedArrival: new Date(now.getTime() + 600000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus2: {
              EstimatedArrival: new Date(now.getTime() + 1100000).toISOString(),
              Load: "SEA",
              Type: "SD",
            },
            NextBus3: {},
          },
        ];
      }
    </script>
  </body>
</html>
