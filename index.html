<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SG Bus Arrival</title>
    <style>
      :root {
        --bg: #232323;
        --cell: #393939;
        --cell2: #494949;
        --teal: #0e8fa0;
        --mint: #a9dcc6;
        --lime: #8ed14b;
        --txt: #f2f2f2;
        --mut: #9a9a9a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        min-height: 100vh;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .clock {
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        color: #f6c343;
      }
      .date {
        font-size: 12px;
        color: var(--mut);
        text-align: right;
      }
      .ctrl {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      button,
      input {
        font: inherit;
        border-radius: 10px;
        border: 1px solid #555;
        background: #2f2f2f;
        color: var(--txt);
        padding: 8px 14px;
      }
      button {
        cursor: pointer;
      }
      button.on {
        background: var(--lime);
        color: #1b2b0a;
        border-color: var(--lime);
      }
      input {
        width: 92px;
        text-align: center;
      }
      input.bad {
        border-color: #e5484d;
      }
      .sp {
        flex: 1;
      }
      .hdr {
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        background: var(--mint);
        color: #12373f;
        margin-bottom: 14px;
      }
      .hdr .code {
        background: var(--teal);
        color: #fff;
        padding: 10px 18px;
        font-size: 24px;
        letter-spacing: 1px;
      }
      .hdr .name {
        padding: 10px 16px;
        font-size: 22px;
        text-transform: uppercase;
        align-self: center;
      }
      .tab {
        display: inline-block;
        background: #e4e4e4;
        color: #222;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 6px 6px 0 0;
      }
      .tabnote {
        font-size: 10px;
        color: var(--mut);
        margin-left: 8px;
        font-weight: 400;
      }
      .inc {
        display: flex;
        gap: 10px;
        padding: 10px;
        background: #1a1a1a;
        border-radius: 0 10px 10px 10px;
        margin-bottom: 16px;
        min-height: 78px;
      }
      .chip {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .chip .t {
        background: #4a4a4a;
        border: 2px solid transparent;
        border-radius: 9px;
        padding: 2px 0;
        font-size: 20px;
        margin-bottom: 6px;
        white-space: nowrap;
      }
      .chip .t.arr {
        background: transparent;
        border-color: #ddd;
      }
      .chip .s {
        background: var(--lime);
        color: #1b2b0a;
        font-size: 22px;
        padding: 2px 6px;
        clip-path: polygon(14% 0, 100% 0, 100% 100%, 14% 100%, 0 50%);
      }
      .cols,
      .row {
        display: grid;
        grid-template-columns: 96px 1fr 1fr 1fr;
        gap: 8px;
      }
      .cols {
        font-size: 11px;
        color: var(--mut);
        padding: 0 2px 4px;
      }
      .row {
        margin-bottom: 8px;
      }
      .svc {
        background: var(--lime);
        color: #1b2b0a;
        border-radius: 10px;
        font-size: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px 4px;
      }
      .c {
        background: var(--cell);
        border-radius: 10px;
        border-left: 4px solid #666;
        padding: 0 12px;
        font-size: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 62px;
      }
      .c:nth-child(3) {
        background: var(--cell2);
      }
      .c.na {
        color: #666;
        border-left-color: #555;
      }
      .SEA {
        border-left-color: #5fc84a;
      }
      .SDA {
        border-left-color: #f2c230;
      }
      .LSD {
        border-left-color: #e5484d;
      }
      .c svg {
        width: 18px;
        height: 18px;
        fill: #bbb;
        flex: none;
      }
      .msg {
        padding: 40px 10px;
        text-align: center;
        color: var(--mut);
        font-weight: 400;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      .filters button {
        font-size: 18px;
        padding: 12px 22px;
        min-height: 50px;
        border-radius: 12px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--mut);
        margin-top: 12px;
        font-weight: 400;
      }
      .demo {
        color: #f6c343;
      }
      .err {
        color: #e5484d;
      }
      @media (max-width: 520px) {
        .cols,
        .row {
          grid-template-columns: 70px 1fr 1fr 1fr;
          gap: 6px;
        }
        .svc {
          font-size: 26px;
        }
        .c {
          font-size: 24px;
          padding: 0 8px;
        }
        .hdr .name {
          font-size: 16px;
        }
        .hdr .code {
          font-size: 20px;
        }
        .chip .t {
          font-size: 15px;
        }
        .chip .s {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="ctrl" id="stops" style="margin: 0"></div>
        <div>
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date"></div>
        </div>
      </div>
      <div class="ctrl">
        <input
          id="stopIn"
          maxlength="5"
          inputmode="numeric"
          placeholder="Stop code"
          aria-label="Bus stop code"
        />
        <button id="go">Go</button>
        <span class="sp"></span>
        <button id="refresh">Refresh <span id="cd">30</span>s</button>
      </div>

      <div class="hdr">
        <div class="code" id="hCode">-----</div>
        <div class="name" id="hName">Loading…</div>
      </div>

      <div class="filters" id="filters"></div>

      <div>
        <span class="tab">INCOMING BUSES</span
        ><span class="tabnote">Buses might not arrive in exact order</span>
      </div>
      <div class="inc" id="inc"></div>

      <div class="cols">
        <div>SERVICE</div>
        <div>ARRIVING (min)</div>
        <div>NEXT (min)</div>
        <div>NEXT 2 (min)</div>
      </div>
      <div id="rows"></div>

      <div class="foot">
        <span id="status">–</span
        ><span
          >Updated <span id="upd">--:--:--</span> · Filter:
          <span id="fl">All Buses</span></span
        >
      </div>
    </div>

    <script>
      /* ========== CONFIG ========== */
      const HARDCODED_API_KEY = ""; // leave empty when using PROXY_URL
      const PROXY_URL = "https://lta-proxy.luikwanlok.workers.dev"; // e.g. "https://lta-proxy.yourname.workers.dev" (no trailing slash)

      // ✏️ Your two nearby stops, each with its OWN destination shortcuts.
      // "All Buses" is added automatically. buses = the service numbers to show.
      const BUS_STOPS = [
        {
          code: "72019",
          name: "Opp Blk 322",
          destinations: [
            { label: "KAJIMA", buses: ["45", "25", "854"] },
            {
              label: "Eunos",
              buses: [
                "15",
                "21",
                "22",
                "25",
                "51",
                "55",
                "60",
                "61",
                "63",
                "63M",
                "854",
                "93",
                "94",
              ],
            },
            { label: "PAYA LEBAR", buses: ["21", "51"] },
            { label: "KEMBANGANG/BEDOK", buses: ["25", "854"] },
            { label: "EAST COAST", buses: ["15", "55"] },
            { label: "ORCHARD", buses: ["5"] },
          ],
        },
        {
          code: "72011",
          name: "Blk 322", // <- replace with the real code
          destinations: [
            // <- example only, edit to suit
            { label: "UBI/MACPHERSON", buses: ["22", "61", "63", "63M"] },
            { label: "BEDOK RESERVOIR", buses: ["5", "21", "29", "61"] },
          ],
        },
      ];
      // Shown for any other stop typed into the box (empty = just "All Buses")
      const DEFAULT_DESTINATIONS = [];

      /* ========== STATE ========== */
      const $ = (id) => document.getElementById(id);
      const ALL = { label: "ALL", buses: [] };
      let stopCode = BUS_STOPS[0].code,
        filter = ALL;
      let data = null,
        secs = 30,
        busy = false;
      try {
        stopCode = localStorage.getItem("sg_bus_stop") || stopCode;
      } catch (e) {}

      const BUS_ICON =
        '<svg viewBox="0 0 24 24"><path d="M4 16c0 .9.4 1.7 1 2.2V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.8c.6-.5 1-1.3 1-2.2V6c0-3.5-3.6-4-8-4S4 2.5 4 6v10zm3.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM6 11V6h12v5H6z"/></svg>';

      function stopName(code) {
        const s = BUS_STOPS.find((b) => b.code === code);
        return s ? s.name : "Stop " + code;
      }

      /* ========== UI BUILD ========== */
      function drawStopButtons() {
        $("stops").innerHTML = "";
        BUS_STOPS.forEach((s) => {
          const b = document.createElement("button");
          b.textContent = s.name;
          if (s.code === stopCode) b.className = "on";
          b.onclick = () => setStop(s.code);
          $("stops").appendChild(b);
        });
      }
      function drawFilters() {
        $("filters").innerHTML = "";
        const cur = BUS_STOPS.find((b) => b.code === stopCode);
        [ALL, ...((cur && cur.destinations) || DEFAULT_DESTINATIONS)].forEach(
          (f) => {
            const b = document.createElement("button");
            b.textContent = f.label;
            if (f === filter) b.className = "on";
            b.onclick = () => {
              filter = f;
              $("fl").textContent = f.label;
              drawFilters();
              render();
            };
            $("filters").appendChild(b);
          },
        );
      }
      function setStop(code) {
        stopCode = code;
        try {
          localStorage.setItem("sg_bus_stop", code);
        } catch (e) {}
        $("stopIn").value = BUS_STOPS.some((b) => b.code === code) ? "" : code;
        data = null;
        filter = ALL;
        $("fl").textContent = ALL.label;
        drawStopButtons();
        drawFilters();
        load();
      }
      $("go").onclick = applyInput;
      $("stopIn").onkeydown = (e) => {
        if (e.key === "Enter") applyInput();
      };
      function applyInput() {
        const v = $("stopIn").value.trim();
        if (!/^\d{5}$/.test(v)) {
          $("stopIn").classList.add("bad");
          return;
        }
        $("stopIn").classList.remove("bad");
        setStop(v);
      }
      $("refresh").onclick = () => load();

      /* ========== CLOCK & TIMER ========== */
      function tick() {
        const n = new Date();
        $("clock").textContent = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Singapore",
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(n);
        $("date").textContent =
          new Intl.DateTimeFormat("en-SG", {
            timeZone: "Asia/Singapore",
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          }).format(n) + " (SGT)";
        if (--secs <= 0) load(true);
        $("cd").textContent = Math.max(secs, 0);
        if (data && secs % 10 === 0) render(); // keep minutes ticking down
      }

      /* ========== DATA ========== */
      function mockData() {
        const t = (m, l = "SEA", f = "WAB") => ({
          EstimatedArrival: new Date(
            Date.now() + m * 60000 + 20000,
          ).toISOString(),
          Load: l,
          Feature: f,
        });
        const svc = (n, a, b, c, l) => ({
          ServiceNo: n,
          NextBus: t(a, l),
          NextBus2: t(b, "SDA", ""),
          NextBus3: t(c, "SEA"),
        });
        return {
          Services: [
            svc("54", 7, 12, 20, "SEA"),
            svc("61", 9, 14, 22, "SDA"),
            svc("63", 3, 18, 25, "SEA"),
            svc("80", 13, 22, 30, "LSD"),
            svc("124", 0, 13, 21, "SEA"),
            svc("5", 5, 15, 24, "SEA"),
          ],
        };
      }
      async function load(auto = false) {
        if (busy) return;
        busy = true;
        secs = 30;
        $("hCode").textContent = stopCode;
        $("hName").textContent = stopName(stopCode);
        try {
          if (!PROXY_URL && !HARDCODED_API_KEY) {
            data = mockData();
            $("status").innerHTML =
              '<span class="demo">Demo mode: set PROXY_URL</span>';
          } else {
            const r = PROXY_URL
              ? await fetch(`${PROXY_URL}/?BusStopCode=${stopCode}`)
              : await fetch(
                  `https://datamall2.mytransport.sg/ltaodataservice/v3/BusArrival?BusStopCode=${stopCode}`,
                  {
                    headers: {
                      AccountKey: HARDCODED_API_KEY,
                      accept: "application/json",
                    },
                  },
                );
            if (!r.ok) throw new Error("HTTP " + r.status);
            data = await r.json();
            $("status").textContent = "Live: LTA DataMall";
          }
          $("upd").textContent = new Date().toLocaleTimeString("en-GB");
          render();
        } catch (e) {
          console.error(e);
          $("status").innerHTML =
            '<span class="err">Connection error: ' + e.message + "</span>";
        } finally {
          busy = false;
        }
      }

      /* ========== RENDER ========== */
      const mins = (b) =>
        b && b.EstimatedArrival
          ? Math.floor((new Date(b.EstimatedArrival) - Date.now()) / 60000)
          : null;
      const label = (m) => (m === null ? "–" : m <= 0 ? "Arr" : m);

      function cell(b) {
        const m = mins(b);
        if (m === null) return '<div class="c na">–</div>';
        return `<div class="c ${b.Load || ""}"><span>${label(m)}</span>${b.Feature === "WAB" ? BUS_ICON : ""}</div>`;
      }
      function render() {
        let list = (data && data.Services) || [];
        if (filter.buses.length)
          list = list.filter((s) => filter.buses.includes(s.ServiceNo));
        list = [...list].sort(
          (a, b) =>
            parseInt(a.ServiceNo) - parseInt(b.ServiceNo) ||
            a.ServiceNo.localeCompare(b.ServiceNo),
        );

        // Incoming strip: the soonest buses across all listed services
        const next = list
          .map((s) => ({ n: s.ServiceNo, m: mins(s.NextBus) }))
          .filter((x) => x.m !== null)
          .sort((a, b) => a.m - b.m)
          .slice(0, 4);
        $("inc").innerHTML = next.length
          ? next
              .map(
                (x) =>
                  `<div class="chip"><div class="t${x.m <= 0 ? " arr" : ""}">${x.m <= 0 ? "Arr" : x.m + " min"}</div><div class="s">${x.n}</div></div>`,
              )
              .join("")
          : '<div class="msg" style="width:100%;padding:12px">No buses</div>';

        $("rows").innerHTML = list.length
          ? list
              .map(
                (s) =>
                  `<div class="row"><div class="svc">${s.ServiceNo}</div>${cell(s.NextBus)}${cell(s.NextBus2)}${cell(s.NextBus3)}</div>`,
              )
              .join("")
          : `<div class="msg">No bus services found${filter.buses.length ? " for “" + filter.label + "”" : ""} at this stop.</div>`;
      }

      /* ========== INIT ========== */
      $("stopIn").value = BUS_STOPS.some((b) => b.code === stopCode)
        ? ""
        : stopCode;
      $("fl").textContent = filter.label;
      drawStopButtons();
      drawFilters();
      tick();
      setInterval(tick, 1000);
      load();
    </script>
  </body>
</html>
