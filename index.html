<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SG Bus Arrival</title>
    <style>
      :root {
        --bg: #232323;
        --cell: #393939;
        --cell2: #494949;
        --teal: #0e8fa0;
        --mint: #a9dcc6;
        --lime: #8ed14b;
        --txt: #f2f2f2;
        --mut: #9a9a9a;
      }
      /* Everything scales from this one value: tuned for a 12.9" iPad Pro (1024x1366 / 1366x1024) */
      html {
        font-size: clamp(14px, min(1.9vw, 2.3vh), 30px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--txt);
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        min-height: 100vh;
      }
      .wrap {
        width: 100%;
        max-width: 110rem;
        margin: 0 auto;
        padding: 0.9rem 1.2rem;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.8rem;
      }
      .clock {
        font-size: 2.2rem;
        font-variant-numeric: tabular-nums;
        color: #f6c343;
        line-height: 1;
      }
      .date {
        font-size: 0.8rem;
        color: var(--mut);
        text-align: right;
        margin-top: 0.2rem;
      }
      .ctrl {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 0.8rem;
      }
      button,
      input {
        font: inherit;
        font-size: 1rem;
        border-radius: 0.7rem;
        border: 1px solid #555;
        background: #2f2f2f;
        color: var(--txt);
        padding: 0.55rem 1rem;
      }
      button {
        cursor: pointer;
      }
      button.on {
        background: var(--lime);
        color: #1b2b0a;
        border-color: var(--lime);
      }
      .big,
      .filters button {
        font-size: 1rem;
        padding: 0.5rem 0.9rem;
        min-height: 1.5rem;
        border-radius: 0.5rem;
      }
      input {
        width: 7rem;
        text-align: center;
      }
      input.bad {
        border-color: #e5484d;
      }
      .sp {
        flex: 1;
      }
      .hdr {
        display: flex;
        border-radius: 0.8rem;
        overflow: hidden;
        background: var(--mint);
        color: #12373f;
        margin-bottom: 1rem;
      }
      .hdr .code {
        background: var(--teal);
        color: #fff;
        padding: 0.7rem 1.3rem;
        font-size: 1.7rem;
        letter-spacing: 1px;
      }
      .hdr .name {
        padding: 0.7rem 1.1rem;
        font-size: 1.5rem;
        text-transform: uppercase;
        align-self: center;
      }

      .hdr .clk {
        margin-left: auto;
        padding: 0.4rem 1.1rem;
        text-align: right;
      }
      .hdr .clock {
        color: #12373f;
        font-size: 1.7rem;
      }
      .hdr .date {
        color: #2f5f66;
        margin-top: 0.1rem;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .tab {
        position: relative;
        top: 0.12rem;
        z-index: 1;
        display: inline-block;
        background: #e4e4e4;
        color: #222;
        font-size: 1rem;
        padding: 0.2rem 0.7rem;
        border-radius: 0.4rem 0.4rem 0 0;
      }
      .tabnote {
        font-size: 0.65rem;
        color: var(--mut);
        margin-left: 0.5rem;
        font-weight: 400;
      }
      .inc {
        border: 0.12rem solid #6fd3cf;
        display: flex;
        gap: 0.8rem;
        padding: 0.8rem;
        background: #1a1a1a;
        border-radius: 0 0.7rem 0.7rem 0.7rem;
        margin-bottom: 1.1rem;
        min-height: 5.5rem;
      }
      .chip {
        flex: 1;
        text-align: center;
        min-width: 0;
      }
      .chip .t {
        background: #4a4a4a;
        border: 0.15rem solid transparent;
        border-radius: 0.6rem;
        padding: 0.2rem 0;
        font-size: 1.45rem;
        margin-bottom: 0.45rem;
        white-space: nowrap;
      }
      .chip .t.arr {
        background: transparent;
        border-color: #ddd;
      }
      .chip .s {
        background: var(--lime);
        color: #1b2b0a;
        font-size: 2.3rem;
        padding: 0.1rem 0.5rem;
        clip-path: polygon(14% 0, 100% 0, 100% 100%, 14% 100%, 0 50%);
      }
      .cols,
      .row {
        display: grid;
        grid-template-columns: 7rem 1fr 1fr 1fr;
        gap: 0.6rem;
      }
      .cols {
        font-size: 0.75rem;
        color: var(--mut);
        padding: 0 0.15rem 0.3rem;
      }
      .row {
        margin-bottom: 0.6rem;
      }
      .svc {
        background: var(--lime);
        color: #1b2b0a;
        border-radius: 0.7rem;
        font-size: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 0.2rem;
      }
      .c {
        --bar: #666;
        position: relative;
        background: var(--cell);
        border-radius: 0.7rem;
        padding: 0 0.9rem;
        font-size: 2.2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 4.4rem;
      }
      .c:nth-child(3) {
        background: var(--cell2);
      }
      .c.na {
        color: #666;
        border-left-color: #555;
      }
      .c::before {
        content: "";
        position: absolute;
        left: -0.45rem;
        top: 0;
        bottom: 0;
        width: 0.22rem;
        border-radius: 0.2rem;
        background: var(--bar);
      }
      .SEA {
        --bar: #3fe0c5;
      }
      .SDA {
        --bar: #f2d84a;
      }
      .LSD {
        --bar: #ff5a64;
      }
      .SDA {
        border-left-color: #f2c230;
      }
      .LSD {
        border-left-color: #e5484d;
      }
      .c svg {
        width: 1.3rem;
        height: 1.3rem;
        fill: #bbb;
        flex: none;
      }
      .msg {
        padding: 2.5rem 0.6rem;
        text-align: center;
        color: var(--mut);
        font-weight: 400;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--mut);
        margin-top: 0.8rem;
        font-weight: 400;
      }
      .demo {
        color: #f6c343;
      }
      .err {
        color: #e5484d;
      }
      @media (max-width: 560px) {
        .cols,
        .row {
          grid-template-columns: 4.6rem 1fr 1fr 1fr;
          gap: 0.4rem;
        }
        .svc {
          font-size: 1.7rem;
        }
        .c {
          font-size: 1.6rem;
          padding: 0 0.5rem;
        }
        .chip .t {
          font-size: 1rem;
        }
        .chip .s {
          font-size: 1.1rem;
        }
        .hdr .name {
          font-size: 1rem;
        }
        .hdr .code {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="ctrl" style="margin: 0">
          <span class="ctrl" id="stops" style="margin: 0"></span>
          <input
            id="stopIn"
            class="big"
            maxlength="5"
            inputmode="numeric"
            placeholder="Stop code"
            aria-label="Bus stop code"
          />
          <button id="go" class="big">Go</button>
        </div>
        <button id="refresh" class="big">Refresh <span id="cd"></span>s</button>
      </div>

      <div class="hdr">
        <div class="code" id="hCode">-----</div>
        <div class="name" id="hName">Loading…</div>
        <div class="clk">
          <div class="clock" id="clock">--:--:--</div>
          <div class="date" id="date"></div>
        </div>
      </div>

      <div class="filters" id="filters"></div>

      <div>
        <span class="tab">INCOMING BUSES</span
        ><span class="tabnote">Buses might not arrive in exact order</span>
      </div>
      <div class="inc" id="inc"></div>

      <div class="cols">
        <div>SERVICE</div>
        <div>ARRIVING (min)</div>
        <div>NEXT (min)</div>
        <div>NEXT 2 (min)</div>
      </div>
      <div id="rows"></div>

      <div class="foot">
        <span id="status">–</span
        ><span
          >Updated <span id="upd">--:--:--</span> · Filter:
          <span id="fl">All Buses</span></span
        >
      </div>
    </div>

    <script>
      /* ========== CONFIG ========== */
      const HARDCODED_API_KEY = ""; // leave empty when using PROXY_URL
      const PROXY_URL = "https://lta-proxy.luikwanlok.workers.dev"; // e.g. "https://lta-proxy.yourname.workers.dev" (no trailing slash)
      const REFRESH_SECS = 40;

      // ✏️ Your two nearby stops, each with its OWN destination shortcuts.
      // "All Buses" is added automatically. buses = the service numbers to show.
      const BUS_STOPS = [
        {
          code: "72019",
          name: "Opp Blk 322",
          destinations: [
            { label: "KAJIMA", buses: ["45", "25", "854"] },
            {
              label: "EUNOS",
              buses: [
                "15",
                "21",
                "22",
                "25",
                "51",
                "55",
                "60",
                "61",
                "63",
                "63M",
                "854",
                "93",
                "94",
              ],
            },
            { label: "PAYA LEBAR", buses: ["21", "51"] },
            { label: "KEMBANGANG/BEDOK", buses: ["25", "854"] },
            { label: "EAST COAST", buses: ["15", "55"] },
            { label: "ORCHARD", buses: ["5"] },
          ],
        },
        {
          code: "72011",
          name: "Blk 322", // <- replace with the real code
          destinations: [
            // <- example only, edit to suit
            { label: "UBI/MACPHERSON", buses: ["22", "61", "63", "63M"] },
            { label: "BEDOK RESERVOIR", buses: ["5", "21", "29", "61"] },
          ],
        },
        {
          code: "82061",
          name: "Eunos Stn/Int",
          destinations: [
            // <- example only, edit to suit
            {
              label: "EUHABITAT",
              buses: [
                "21",
                "22",
                "51",
                "60",
                "60A",
                "61",
                "63",
                "63M",
                "93",
                "94",
              ],
            },
          ],
        },
        {
          code: "92049",
          name: "Parkway Pde",
          destinations: [
            // <- example only, edit to suit
            { label: "EUHABITAT", buses: ["15"] },
          ],
        },
        {
          code: "92041",
          name: "Marine Pde Stn",
          destinations: [
            // <- example only, edit to suit
            { label: "EUHABITAT", buses: ["15"] },
          ],
        },
      ];
      // Shown for any other stop typed into the box (empty = just "All Buses")
      const DEFAULT_DESTINATIONS = [];

      /* ========== STATE ========== */
      const $ = (id) => document.getElementById(id);
      const ALL = { label: "ALL", buses: [] };
      let stopCode = BUS_STOPS[0].code,
        filter = ALL;
      let data = null,
        secs = REFRESH_SECS,
        busy = false;
      try {
        stopCode = localStorage.getItem("sg_bus_stop") || stopCode;
      } catch (e) {}

      const DD_ICON =
        '<svg viewBox="0 0 24 24" fill-rule="evenodd"><path d="M6 2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2v1.5a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5V20H8v1.5a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5V20a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM6.5 4h11v3.5h-11zM6.5 9h11v4.5h-11zM7 15.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM17 15.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>';

      function stopName(code) {
        const s = BUS_STOPS.find((b) => b.code === code);
        return s ? s.name : "Stop " + code;
      }

      /* ========== UI BUILD ========== */
      function drawStopButtons() {
        $("stops").innerHTML = "";
        BUS_STOPS.forEach((s) => {
          const b = document.createElement("button");
          b.textContent = s.name;
          b.className = "big" + (s.code === stopCode ? " on" : "");
          b.onclick = () => setStop(s.code);
          $("stops").appendChild(b);
        });
      }
      function drawFilters() {
        $("filters").innerHTML = "";
        const cur = BUS_STOPS.find((b) => b.code === stopCode);
        [ALL, ...((cur && cur.destinations) || DEFAULT_DESTINATIONS)].forEach(
          (f) => {
            const b = document.createElement("button");
            b.textContent = f.label;
            if (f === filter) b.className = "on";
            b.onclick = () => {
              filter = f;
              $("fl").textContent = f.label;
              drawFilters();
              render();
            };
            $("filters").appendChild(b);
          },
        );
      }
      function setStop(code) {
        stopCode = code;
        try {
          localStorage.setItem("sg_bus_stop", code);
        } catch (e) {}
        $("stopIn").value = BUS_STOPS.some((b) => b.code === code) ? "" : code;
        data = null;
        filter = ALL;
        $("fl").textContent = ALL.label;
        drawStopButtons();
        drawFilters();
        load();
      }
      $("go").onclick = applyInput;
      $("stopIn").onkeydown = (e) => {
        if (e.key === "Enter") applyInput();
      };
      function applyInput() {
        const v = $("stopIn").value.trim();
        if (!/^\d{5}$/.test(v)) {
          $("stopIn").classList.add("bad");
          return;
        }
        $("stopIn").classList.remove("bad");
        setStop(v);
      }
      $("refresh").onclick = () => load();

      /* ========== CLOCK & TIMER ========== */
      function tick() {
        const n = new Date();
        $("clock").textContent = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Singapore",
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(n);
        $("date").textContent =
          new Intl.DateTimeFormat("en-SG", {
            timeZone: "Asia/Singapore",
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
          }).format(n) + " (SGT)";
        if (document.hidden) return;
        if (--secs <= 0) load(true);
        $("cd").textContent = Math.max(secs, 0);
        if (data && secs % 10 === 0) render(); // keep minutes ticking down
      }

      /* ========== DATA ========== */
      function mockData() {
        const t = (m, l = "SEA", ty = "DD") => ({
          EstimatedArrival: new Date(
            Date.now() + m * 60000 + 20000,
          ).toISOString(),
          Load: l,
          Type: ty,
        });
        const svc = (n, a, b, c, l) => ({
          ServiceNo: n,
          NextBus: t(a, l),
          NextBus2: t(b, "SDA", "SD"),
          NextBus3: t(c, "SEA"),
        });
        return {
          Services: [
            svc("54", 7, 12, 20, "SEA"),
            svc("61", 9, 14, 22, "SDA"),
            svc("63", 3, 18, 25, "SEA"),
            svc("80", 13, 22, 30, "LSD"),
            svc("124", 0, 13, 21, "SEA"),
            svc("5", 5, 15, 24, "SEA"),
          ],
        };
      }
      async function load(auto = false) {
        if (busy) return;
        busy = true;
        secs = REFRESH_SECS;
        $("hCode").textContent = stopCode;
        $("hName").textContent = stopName(stopCode);
        try {
          if (!PROXY_URL && !HARDCODED_API_KEY) {
            data = mockData();
            $("status").innerHTML =
              '<span class="demo">Demo mode: set PROXY_URL</span>';
          } else {
            const r = PROXY_URL
              ? await fetch(`${PROXY_URL}/?BusStopCode=${stopCode}`)
              : await fetch(
                  `https://datamall2.mytransport.sg/ltaodataservice/v3/BusArrival?BusStopCode=${stopCode}`,
                  {
                    headers: {
                      AccountKey: HARDCODED_API_KEY,
                      accept: "application/json",
                    },
                  },
                );
            if (!r.ok) throw new Error("HTTP " + r.status);
            data = await r.json();
            $("status").textContent = "Live: LTA DataMall";
          }
          $("upd").textContent = new Date().toLocaleTimeString("en-GB");
          render();
        } catch (e) {
          console.error(e);
          $("status").innerHTML =
            '<span class="err">Connection error: ' + e.message + "</span>";
        } finally {
          busy = false;
        }
      }

      /* ========== RENDER ========== */
      const mins = (b) =>
        b && b.EstimatedArrival
          ? Math.floor((new Date(b.EstimatedArrival) - Date.now()) / 60000)
          : null;
      const label = (m) => (m === null ? "–" : m <= 0 ? "Arr" : m);

      function cell(b) {
        const m = mins(b);
        if (m === null) return '<div class="c na">–</div>';
        return `<div class="c ${b.Load || ""}"><span>${label(m)}</span>${b.Type === "DD" ? DD_ICON : ""}</div>`;
      }
      function render() {
        let list = (data && data.Services) || [];
        if (filter.buses.length)
          list = list.filter((s) => filter.buses.includes(s.ServiceNo));
        list = [...list].sort(
          (a, b) =>
            parseInt(a.ServiceNo) - parseInt(b.ServiceNo) ||
            a.ServiceNo.localeCompare(b.ServiceNo),
        );

        // Incoming strip: the soonest buses across all listed services
        const next = list
          .map((s) => ({ n: s.ServiceNo, m: mins(s.NextBus) }))
          .filter((x) => x.m !== null)
          .sort((a, b) => a.m - b.m)
          .slice(0, 5);
        $("inc").innerHTML = next.length
          ? next
              .map(
                (x) =>
                  `<div class="chip"><div class="t${x.m <= 0 ? " arr" : ""}">${x.m <= 0 ? "Arr" : x.m + " min"}</div><div class="s">${x.n}</div></div>`,
              )
              .join("")
          : '<div class="msg" style="width:100%;padding:12px">No buses</div>';

        $("rows").innerHTML = list.length
          ? list
              .map(
                (s) =>
                  `<div class="row"><div class="svc">${s.ServiceNo}</div>${cell(s.NextBus)}${cell(s.NextBus2)}${cell(s.NextBus3)}</div>`,
              )
              .join("")
          : `<div class="msg">No bus services found${filter.buses.length ? " for “" + filter.label + "”" : ""} at this stop.</div>`;
      }

      /* ========== INIT ========== */
      $("stopIn").value = BUS_STOPS.some((b) => b.code === stopCode)
        ? ""
        : stopCode;
      $("fl").textContent = filter.label;
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load();
      });
      drawStopButtons();
      drawFilters();
      tick();
      setInterval(tick, 1000);
      load();
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load();
      });
    </script>
  </body>
</html>
